<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ABHAR GAME</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            background-color: #ffb6c1; /* Soft pink */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            color: #800020;
            overflow: hidden;
            padding: 15px;
        }
        #header-area {
            text-align: center;
            width: 100%;
        }
        h1 {
            margin: 5px 0 0 0;
            font-size: 28px;
            text-shadow: 2px 2px 0px #fff;
        }
        #score-board {
            font-size: 20px;
            margin: 5px 0;
            font-weight: bold;
        }
        #game-container {
            position: relative;
            border: 6px solid #800020;
            background-color: #ffc0cb;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 90vw; 
            max-width: 360px; 
            aspect-ratio: 1 / 1;
        }
        canvas {
            display: block;
            image-rendering: auto;
            width: 100%;
            height: 100%;
        }
        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 182, 193, 0.95);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
        }
        #restart-btn {
            margin-top: 15px;
            padding: 12px 28px;
            background-color: #800020;
            color: white;
            border: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 4px solid #4a0012;
            border-radius: 4px;
        }
        #controls {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #800020;
            color: white;
            border: 3px solid #fff;
            border-radius: 12px;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-shadow: 0 4px 0px #4a0012;
        }
        .btn:active {
            background-color: #4a0012;
            transform: translateY(2px);
            box-shadow: 0 2px 0px #4a0012;
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>

    <div id="header-area">
        <h1>ABHAR GAME</h1>
        <div id="score-board">SCORE: <span id="score">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="360" height="360"></canvas>
        <div id="game-over-screen">
            <div>GAME OVER</div>
            <button id="restart-btn" onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>

    <div id="controls">
        <div class="btn" id="btn-up" onclick="handleInput('UP')">▲</div>
        <div class="btn" id="btn-left" onclick="handleInput('LEFT')">◀</div>
        <div class="btn" id="btn-right" onclick="handleInput('RIGHT')">▶</div>
        <div class="btn" id="btn-down" onclick="handleInput('DOWN')">▼</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const gameOverScreen = document.getElementById("game-over-screen");

        const gridSize = 20; 
        const tileCount = canvas.width / gridSize;

        const COLOR_MAROON = "#800020";
        const COLOR_NAVY = "#000080";
        const HEART_COLOR = "#ff0044"; 

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let nextDirection = { dx: gridSize, dy: 0 };

        function startGame() {
            snake = [
                { x: gridSize * 5, y: gridSize * 8 },
                { x: gridSize * 4, y: gridSize * 8 },
                { x: gridSize * 3, y: gridSize * 8 }
            ];
            score = 0;
            scoreElement.innerText = score;
            dx = gridSize;
            dy = 0;
            nextDirection = { dx: gridSize, dy: 0 };
            gameOverScreen.style.display = "none";
            placeFood();
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(update, 150); 
        }

        // FIXED: Constrained limits so food never spawns touching any borders
        function placeFood() {
            food.x = (Math.floor(Math.random() * (tileCount - 2)) + 1) * gridSize;
            food.y = (Math.floor(Math.random() * (tileCount - 2)) + 1) * gridSize;
            
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === food.x && snake[i].y === food.y) {
                    placeFood();
                    break;
                }
            }
        }

        function update() {
            dx = nextDirection.dx;
            dy = nextDirection.dy;

            const head = { x: snake.x + dx, y: snake.y + dy };

            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return gameOver();
            }

            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) return gameOver();
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                placeFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function drawHeart(x, y, size) {
            ctx.save();
            ctx.beginPath();
            const topCurveHeight = size * 0.3;
            ctx.moveTo(x, y + topCurveHeight);
            
            ctx.bezierCurveTo(
                x - size / 2, y - topCurveHeight / 2, 
                x - size, y + topCurveHeight, 
                x, y + size
            );
            
            ctx.bezierCurveTo(
                x + size, y + topCurveHeight, 
                x + size / 2, y - topCurveHeight / 2, 
                x, y + topCurveHeight
            );
            
            ctx.closePath();
            ctx.fillStyle = HEART_COLOR;
            ctx.fill();
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            snake.forEach((part, index) => {
                ctx.fillStyle = (index % 2 === 0) ? COLOR_MAROON : COLOR_NAVY;
                ctx.fillRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2);
            });

            const centerX = food.x + gridSize / 2;
            const centerY = food.y + 2; 
            drawHeart(centerX, centerY, 16); 
        }

        function gameOver() {
            clearInterval(gameInterval);
            gameOverScreen.style.display = "flex";
        }

        function resetGame() {
            startGame();
        }

        function handleInput(dir) {
            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            if (dir === 'LEFT' && !goingRight) nextDirection = { dx: -gridSize, dy: 0 };
            if (dir === 'UP' && !goingDown) nextDirection = { dx: 0, dy: -gridSize };
            if (dir === 'RIGHT' && !goingLeft) nextDirection = { dx: gridSize, dy: 0 };
            if (dir === 'DOWN' && !goingUp) nextDirection = { dx: 0, dy: gridSize };
        }

        window.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft" || e.key === "a") handleInput("LEFT");
            if (e.key === "ArrowUp" || e.key === "w") handleInput("UP");
            if (e.key === "ArrowRight" || e.key === "d") handleInput("RIGHT");
            if (e.key === "ArrowDown" || e.key === "s") handleInput("DOWN");
        });

        startGame();
    </script>
</body>
</html>
